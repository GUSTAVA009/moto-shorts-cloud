name: GUSTAVA - One reviewed native 2K Short to YouTube
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-control-2k-20261107.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: youtube-direct-uploads
  cancel-in-progress: false

jobs:
  owner-2k-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EPISODE: control-before-the-jump-2k-20261107
      CHANNEL_ID: UCS0QCodPcFBTjMt4ioEWOUw
      FINAL_SHA: f2c22eddfeea1968fb5aa9eab2c9a8a804f66607f7fc9fec5c7ec732f0bc9db3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact reviewed 2K master from dedicated recovery branch
        uses: actions/checkout@v4
        with:
          ref: release/control-2k-20261107
          path: master
          persist-credentials: false
      - name: Install media tools and Google YouTube API client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Validate 2K master SHA, three true native-4K sources, sound and frame review
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          ep=os.environ["EPISODE"]
          d=Path("master/release_assets")/ep
          video=d/(ep+".mp4")
          assert video.is_file(),"PINNED_2K_MP4_MISSING"
          sha=hashlib.sha256(video.read_bytes()).hexdigest()
          assert sha==os.environ["FINAL_SHA"],"IMMUTABLE_VIDEO_SHA_MISMATCH"
          qa=json.loads((d/"qa.json").read_text(encoding="utf8"))
          pub=json.loads((d/"publication.json").read_text(encoding="utf8"))
          assert qa["final_mp4_sha256"]==sha and qa["episode_id"]==ep and qa["video_bytes"]==video.stat().st_size,"QA_HASH_OR_EPISODE_MISMATCH"
          assert pub["episode_id"]==ep and pub.get("owner_authorized_publication") is True and pub.get("assistant_visual_reviewed") is True,"OWNER_AUTHORIZATION_OR_VISUAL_REVIEW_MISSING"
          assert pub.get("reviewed_for_direct_youtube_upload") is True,"REVIEWED_PUBLICATION_FLAG_MISSING"
          assert qa["audio_qa_status"]=="passed" and qa["asr_matches_original_mix_exactly"] is True and qa["final_word_present"] is True,"ORIGINAL_DEEP_VOICE_QA_MISSING"
          assert qa["mixed_final_asr_coverage"]>=.86 and qa["visual_review_status"]=="contact_sheet_reviewed_9_frames","NARRATION_OR_SAMPLE_QA_MISSING"
          assert qa["decode_passed"] is True and qa["video_freeze_over_2s"] is False,"MP4_FROZEN_OR_DECODING_FAILURE"
          assert qa["original_audio_mix_video_sha256"]=="a8c8658f028defa3feef2279bc0ad05125f1c09165079e8da3df6cb031907ed0","VOICE_ORIGIN_CHANGED"
          assert qa["source_pixels"].startswith("native 2160x3840"),"ORIGINAL_SOURCE_4K_NOT_VERIFIED"
          rights=qa["source_sha256"]
          approved={
            "solo_action_5803634.mp4":"7244d8f3124c77b3f6baa469c43f4ed6f4bf41502a035cd87ddbd5d4e28bdfb9",
            "forest_riders_5806214.mp4":"1958de1e30579dfbfe0373d32890aeef389917013c64db44149bb63dea1838e7",
            "melbourne_stunt_34110751.mp4":"c2e1d6d4be0e000e9ab36392a522cc931eaa3c62e7179b2afafba9e02c6ab26d"
          }
          assert len(rights)==3 and {x["filename"]:x["source_sha256"] for x in rights}==approved,"LICENSED_SOURCE_HASH_MISMATCH"
          assert all(x["license"]=="Pexels License" and x["source_resolution"]==[2160,3840] and x["source_page"].startswith("https://www.pexels.com/video/") and x["author"] for x in rights),"NATIVE_4K_LICENSE_PROOF_MISSING"
          assert "Voiceover Generated with AIDOCMAKER.COM" in pub["description"],"APPROVED_VOICE_CREDIT_MISSING"
          p=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,width,height,r_frame_rate","-of","json",str(video)],text=True))
          v=next(x for x in p["streams"] if x.get("codec_type")=="video")
          assert (int(v["width"]),int(v["height"]))==(1440,2560) and v["r_frame_rate"]=="30/1","NOT_NATIVE_2K_30FPS_FINAL"
          assert 15.45<float(p["format"]["duration"])<15.75,"UNEXPECTED_VIDEO_DURATION"
          assert any(x["codec_type"]=="audio" for x in p["streams"]),"NO_AUDIO"
          subprocess.run(["ffmpeg","-hide_banner","-nostdin","-loglevel","error","-i",str(video),"-f","null","-"],check=True,capture_output=True,timeout=120)
          freeze=subprocess.run(["ffmpeg","-hide_banner","-nostdin","-i",str(video),"-an","-vf","freezedetect=n=-45dB:d=2.1","-f","null","-"],check=True,capture_output=True,text=True,timeout=120)
          assert "freeze_start:" not in freeze.stderr,"LONG_VISUAL_FREEZE_DETECTED"
          print("NATIVE_2K_OWNER_APPROVED_VISUAL_SOUND_LICENSE_QA_PASSED",ep,sha,flush=True)
          PY
      - name: Validate public metadata and final 2K production guard without upload
        run: |
          python3 cloud-shorts/youtube_upload.py \
            --video "master/release_assets/$EPISODE/$EPISODE.mp4" \
            --metadata "master/release_assets/$EPISODE/publication.json" \
            --privacy public --dry-run
      - name: Verify live OAuth belongs to the exact GUSTAVA channel before reserve
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          test "$YOUTUBE_EXPECTED_CHANNEL_ID" = "$CHANNEL_ID"
          python3 cloud-shorts/youtube_upload.py \
            --video "master/release_assets/$EPISODE/$EPISODE.mp4" \
            --metadata "master/release_assets/$EPISODE/publication.json" \
            --privacy public --check-auth
      - name: Reserve exact episode and SHA on immutable upload ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 cloud-shorts/upload_guard.py reserve \
            --video "master/release_assets/$EPISODE/$EPISODE.mp4" \
            --channel "$CHANNEL_ID" \
            --episode "$EPISODE" --output upload-guard-reservation.json
      - name: Upload exact 2K MP4 to GUSTAVA YouTube as PUBLIC
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          python3 cloud-shorts/youtube_upload.py \
            --video "master/release_assets/$EPISODE/$EPISODE.mp4" \
            --metadata "master/release_assets/$EPISODE/publication.json" \
            --privacy public --receipt youtube-upload-receipt.json
      - name: Store confirmed YouTube video ID with deduplication receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 cloud-shorts/upload_guard.py finish \
            --reservation upload-guard-reservation.json \
            --receipt youtube-upload-receipt.json
      - name: Read back real YouTube privacy for the saved video ID
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          PYTHONPATH=cloud-shorts python3 - <<'PY'
          import json
          from pathlib import Path
          from youtube_upload import authenticated_api,verify_channel
          f=Path("youtube-upload-receipt.json")
          rec=json.loads(f.read_text(encoding="utf8"))
          api=authenticated_api()
          verify_channel(api)
          items=api.videos().list(part="id,status",id=rec["video_id"]).execute().get("items",[])
          verified=(len(items)==1 and items[0]["id"]==rec["video_id"] and items[0].get("status",{}).get("privacyStatus")=="public")
          rec["public_visibility_verified"]=bool(verified)
          f.write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding="utf8")
          print("YOUTUBE_VIDEO_ID",rec["video_id"],"PUBLIC_STATUS",verified)
          PY
      - name: Preserve actual YouTube upload receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-2k-youtube-receipt
          path: youtube-upload-receipt.json
          retention-days: 30
          if-no-files-found: error
