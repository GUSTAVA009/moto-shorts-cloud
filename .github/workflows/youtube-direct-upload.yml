name: YouTube Shorts - Direct API Upload (free, opt-in)
on:
  push:
    branches:
      - main
    paths:
      - cloud-shorts/youtube_upload.py
      - cloud-shorts/test_youtube_upload.py
      - cloud-shorts/oauth_bootstrap.py
      - cloud-shorts/upload_guard.py
      - cloud-shorts/test_upload_guard.py
      - cloud-shorts/direct_schedule.py
      - cloud-shorts/direct_upload_ready.py
      - cloud-shorts/direct_queue_select.py
      - cloud-shorts/test_direct_schedule.py
      - cloud-shorts/test_direct_upload_ready.py
      - cloud-shorts/test_direct_queue_select.py
      - .github/workflows/youtube-direct-upload.yml
  workflow_dispatch:
    inputs:
      video_run_id:
        description: "Successful NEW Shorts render run ID (never reuse the published first video)"
        required: true
        type: string
      episode:
        description: "Exact catalog episode ID; QA gate validates it"
        required: true
        type: string
      artifact_kind:
        description: "Which cloud preview workflow produced the MP4?"
        required: true
        type: choice
        default: new
        options: [new, daily]
      schedule_next:
        description: "Schedule 90+ minutes ahead, max 15/day, only with privacy=private"
        required: true
        type: boolean
        default: false
      privacy:
        description: "YouTube visibility (official API; subject to YouTube policies)"
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-direct-uploads
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install caption-measurement dependency for global regression suite
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow
      - name: Validate uploader without any keys or uploads
        run: python3 -m unittest discover -s cloud-shorts -p 'test_*.py' -v

  upload:
    if: github.event_name == 'workflow_dispatch'
    needs: safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EPISODE: ${{ inputs.episode }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download a reviewed Shorts MP4 from an existing render
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_kind == 'daily' && format('daily-preview-{0}-{1}', inputs.episode, inputs.video_run_id) || format('new-shorts-{0}-{1}', inputs.episode, inputs.video_run_id) }}
          path: staged
          repository: ${{ github.repository }}
          run-id: ${{ inputs.video_run_id }}
          github-token: ${{ github.token }}
      - name: Independently validate approved episode, original footage, voice and MP4
        env:
          GUSTAVA_ORIGINAL_VOICE_APPROVED: ${{ vars.GUSTAVA_ORIGINAL_VOICE_APPROVED }}
          GUSTAVA_VOICE_REFERENCE_SHA256: ${{ vars.GUSTAVA_VOICE_REFERENCE_SHA256 }}
        run: |
          python3 cloud-shorts/direct_upload_ready.py --episode "$EPISODE" \
            --staged "staged/$EPISODE" --output "staged/$EPISODE/reviewed-direct-metadata.json"
          python3 cloud-shorts/youtube_upload.py \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --metadata "staged/$EPISODE/reviewed-direct-metadata.json" \
            --privacy "${{ inputs.privacy }}" --dry-run
      - name: Validate OAuth setup before reserving an upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          required = ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Google OAuth secrets not yet installed: " + ", ".join(missing))
          print("OAuth secret presence checked; no values displayed")
          PY
      - name: Install free official Google API client
        run: python3 -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Verify LIVE OAuth and safe scheduling before reserving video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          set -euo pipefail
          mode=(--check-auth)
          if [[ "${{ inputs.schedule_next }}" == "true" ]]; then
            if [[ "${{ inputs.privacy }}" != "private" ]]; then
              echo "::error::Scheduling requires a private upload."
              exit 1
            fi
            mode=(--schedule-next --check-schedule)
          fi
          python3 cloud-shorts/youtube_upload.py \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --metadata "staged/$EPISODE/reviewed-direct-metadata.json" \
            --privacy "${{ inputs.privacy }}" "${mode[@]}"
      - name: Reserve video hash in durable GitHub upload ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          python3 cloud-shorts/upload_guard.py reserve \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --channel "$YOUTUBE_EXPECTED_CHANNEL_ID" --episode "$EPISODE" \
            --output upload-guard-reservation.json
      - name: Upload to precisely authorized YouTube channel (OAuth)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          set -euo pipefail
          mode=()
          if [[ "${{ inputs.schedule_next }}" == "true" ]]; then mode=(--schedule-next); fi
          python3 cloud-shorts/youtube_upload.py \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --metadata "staged/$EPISODE/reviewed-direct-metadata.json" \
            --privacy "${{ inputs.privacy }}" \
            --receipt youtube-upload-receipt.json "${mode[@]}"
      - name: Finalize durable upload receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 cloud-shorts/upload_guard.py finish \
            --reservation upload-guard-reservation.json \
            --receipt youtube-upload-receipt.json
      - name: Store upload receipt without OAuth keys
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-upload-receipt-${{ github.run_id }}
          path: youtube-upload-receipt.json
          retention-days: 30
          if-no-files-found: error
