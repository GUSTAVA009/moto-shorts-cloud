name: GUSTAVA - Retry-Safe Verified MP4 Publishing
on:
  workflow_dispatch:
  schedule:
    - cron: "33 */3 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: gustava-verified-publora-delivery
  cancel-in-progress: false

jobs:
  catch-up:
    # Safety hold: prevent consuming the last Publora monthly slots while migrating.
    # Existing externally scheduled Publora posts are not affected.
    # Requires a separate explicit PUBLORA_CATCHUP_ENABLED=true to resume.
    if: ${{ vars.PUBLORA_AUTO_PUBLISH_ENABLED == 'true' && vars.PUBLORA_CATCHUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select only original ASR-passed unpublished MP4
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_find_pending_publication.py' -v
          python3 cloud-shorts/find_pending_publication.py --output "$GITHUB_OUTPUT"
      - name: Download the exact verified MP4 and its proof
        if: steps.pick.outputs.has_job == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.pick.outputs.artifact_name }}
          run-id: ${{ steps.pick.outputs.render_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: staged
      - name: Resume through Publora without duplicate uploads
        if: steps.pick.outputs.has_job == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          PUBLORA_AUTO_PUBLISH_ENABLED: ${{ vars.PUBLORA_AUTO_PUBLISH_ENABLED }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          test -s "staged/$EPISODE/$EPISODE.mp4"
          test -s "staged/$EPISODE/voice_qa.json"
          test -s "staged/$EPISODE/mixed_audio_qa.json"
          python3 cloud-shorts/publora_autopublish.py \
            --episode "$EPISODE" \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --metadata "staged/$EPISODE/publication.json" \
            --voice-qa "staged/$EPISODE/voice_qa.json" \
            --mixed-qa "staged/$EPISODE/mixed_audio_qa.json"
