name: First motorcycle short - Pexels footage + Russian voice
on:
  push:
    branches:
      - main
    paths:
      - 'cloud-shorts/render_short.py'
      - 'cloud-shorts/soundtrack.py'
      - '.github/workflows/first-moto-short.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fonts and FFmpeg
        run: |
          sudo apt-get install -y -o Dpkg::Use-Pty=0 --no-install-recommends ffmpeg
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Download licensed footage, voice and render
        run: python3 cloud-shorts/render_short.py
      - name: Validate final video
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json cloud-shorts/dist/first_motorcycle_short.mp4
          test -s cloud-shorts/dist/first_motorcycle_short.mp4
          test -s cloud-shorts/dist/publication.json
      - name: Store video, thumbnail and publishing notes
        uses: actions/upload-artifact@v4
        with:
          name: first-motorcycle-short-review
          path: |
            cloud-shorts/dist/first_motorcycle_short.mp4
            cloud-shorts/dist/thumbnail.jpg
            cloud-shorts/dist/publication.json
          retention-days: 3
          if-no-files-found: error
