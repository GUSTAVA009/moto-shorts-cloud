name: GUSTAVA - Cloud Autopilot Credentials Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/autopilot-credentials-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_SECRET: ${{ secrets.R2_BUCKET }}
      R2_BUCKET_VAR: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      BUFFER_AUTO_PUBLISH_ENABLED: ${{ vars.BUFFER_AUTO_PUBLISH_ENABLED }}
      PUBLORA_AUTO_PUBLISH_ENABLED: ${{ vars.PUBLORA_AUTO_PUBLISH_ENABLED }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
    steps:
      - name: List absent connection names, never their values
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          vars_=['BUFFER_API_KEY','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ENDPOINT',
                 'R2_PUBLIC_BASE_URL','PUBLORA_API_KEY','YOUTUBE_REFRESH_TOKEN',
                 'BUFFER_AUTO_PUBLISH_ENABLED','PUBLORA_AUTO_PUBLISH_ENABLED',
                 'YOUTUBE_EXPECTED_CHANNEL_ID']
          state={name:bool(os.environ.get(name)) for name in vars_}
          state['R2_BUCKET']=bool(os.environ.get('R2_BUCKET_SECRET') or os.environ.get('R2_BUCKET_VAR'))
          lines=['# GUSTAVA cloud autopilot readiness (names only, no secrets)', '',
                 '| Configuration item | Present |', '|---|---|']
          for k,v in state.items():
              lines.append(f'| {k} | {"YES" if v else "NO"} |')
          lines.append('')
          buf=all(state.get(k,False) for k in
              ['BUFFER_API_KEY','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ENDPOINT',
               'R2_BUCKET','R2_PUBLIC_BASE_URL','YOUTUBE_EXPECTED_CHANNEL_ID'])
          lines.append(f'Buffer + R2 transport prerequisites: {"PRESENT" if buf else "INCOMPLETE"}')
          lines.append('No upload attempted; no secret values were printed.')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n','utf8')
          print('AUTOPILOT_CREDENTIAL_STATUS', 'READY' if buf else 'MISSING',
                ','.join(k for k,v in state.items() if not v))
          PY
