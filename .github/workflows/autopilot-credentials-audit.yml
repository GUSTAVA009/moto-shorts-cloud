name: GUSTAVA - Buffer Credentials Audit (Read Only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/autopilot-credentials-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_AUTO_PUBLISH_ENABLED: ${{ vars.BUFFER_AUTO_PUBLISH_ENABLED || 'true' }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID || 'UCS0QCodPcFBTjMt4ioEWOUw' }}
    steps:
      - name: Audit required Buffer settings without printing their values
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = bool(os.environ.get('BUFFER_API_KEY'))
          optin = os.environ.get('BUFFER_AUTO_PUBLISH_ENABLED') == 'true'
          channel = os.environ.get('YOUTUBE_EXPECTED_CHANNEL_ID') == 'UCS0QCodPcFBTjMt4ioEWOUw'
          rows = [
              ('Buffer API credential', key),
              ('Buffer auto publishing enabled', optin),
              ('Correct YouTube channel configured', channel),
          ]
          lines=['# GUSTAVA Buffer-only cloud publishing audit','',
                 '| Requirement | Valid |','|---|---|']
          lines += [f'| {name} | {"YES" if ok else "NO"} |' for name,ok in rows]
          lines += ['', 'MP4 transport uses GitHub Releases; Cloudflare R2 is not required.',
                    'No external API write or publishing is performed.']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('BUFFER_CREDENTIAL_STATUS', 'READY' if all(x[1] for x in rows) else 'INCOMPLETE')
          PY
