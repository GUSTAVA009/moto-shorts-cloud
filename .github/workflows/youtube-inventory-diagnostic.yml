name: GUSTAVA - Read only YouTube schedule inventory diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'GUSTAVA009/moto-shorts-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Google client
        run: python3 -m pip install --quiet --disable-pip-version-check google-api-python-client google-auth
      - name: Count immutable upload playlist and schedule anomalies (READ ONLY)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python3 cloud-shorts/youtube_inventory_diagnostic.py
