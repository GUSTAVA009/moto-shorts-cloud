name: Shorts Factory - Three Unique Cloud Previews Daily
on:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-preview.yml', 'cloud-shorts/preview_queue.py', 'cloud-shorts/test_preview_queue.py', 'cloud-shorts/episodes.json', 'cloud-shorts/voice_qa.py', 'cloud-shorts/silero_voice.py', 'cloud-shorts/mixed_audio_qa.py', 'cloud-shorts/publora_autopublish.py']
  schedule:
    - cron: "17 07 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: moto-shorts-unique-preview-queue
  cancel-in-progress: false

jobs:
  daily-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check content queue and reserve next episode
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_render_episode.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_editorial_guard.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_preview_queue.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_engagement_cta.py' -v
          python3 cloud-shorts/editorial_guard.py --catalog cloud-shorts/episodes.json
          python3 cloud-shorts/preview_queue.py choose --output "$GITHUB_OUTPUT"
      - name: Install free audio/video engines
        if: steps.pick.outputs.has_job == 'true'
        run: |
          sudo apt-get install -y -o Dpkg::Use-Pty=0 --no-install-recommends ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check piper-tts==1.8.0 silero==0.5.5
      - name: Produce next unique Shorts preview in GitHub Cloud
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/render_episode.py --episode "$EPISODE"
          ffprobe -v error -show_entries stream=codec_type,width,height \
            -show_entries format=duration -of json "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4"
      - name: Independent Russian speech QA (missing words and endings)
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 -m pip install --disable-pip-version-check faster-whisper==1.2.1 av==18.1.0 || true
          python3 cloud-shorts/voice_qa.py \
            --episode "$EPISODE" \
            --wav "cloud-shorts/work/$EPISODE/new_narration.wav" \
            --out "cloud-shorts/dist/new/$EPISODE/voice_qa.json"
      - name: Verify original Russian words remain clear after MP4 music mixing
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/mixed_audio_qa.py --episode "$EPISODE" \
            --mp4 "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4" \
            --out "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Store MP4, cover, metadata and internal licence records
        if: steps.pick.outputs.has_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-preview-${{ steps.pick.outputs.episode }}-${{ github.run_id }}
          path: cloud-shorts/dist/new/
          retention-days: 30
          if-no-files-found: error
      - name: Mark one-off preview as completed
        if: steps.pick.outputs.has_job == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/preview_queue.py finish --episode "$EPISODE" --qa-report "cloud-shorts/dist/new/$EPISODE/voice_qa.json" --mixed-qa-report "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Publish NEW MP4 through Publora only after Russian QA and account opt-in
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          PUBLORA_AUTO_PUBLISH_ENABLED: ${{ vars.PUBLORA_AUTO_PUBLISH_ENABLED }}
        run: |
          # Safety hold after unintelligible 2026-10-28 aviation narration; preview creation continues.
          # Remove only after verified natural Russian voice and final MP4 review.
          if [ "true" = "true" ]; then
            echo "VOICE_QUALITY_PUBLICATION_HOLD: New automatic YouTube uploads paused until verified free local TTS and video pipeline." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PUBLORA_AUTO_PUBLISH_ENABLED" != "true" ] || [ -z "$PUBLORA_API_KEY" ]; then
            echo "AUTO_PUBLISH_NOT_CONFIGURED: No upload; set verified Publora key and repo variable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -s "cloud-shorts/dist/new/$EPISODE/voice_qa.json" ]; then
            echo "VOICE_QA_MISSING: public upload blocked" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 cloud-shorts/publora_autopublish.py \
            --episode "$EPISODE" \
            --video "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4" \
            --metadata "cloud-shorts/dist/new/$EPISODE/publication.json" \
            --voice-qa "cloud-shorts/dist/new/$EPISODE/voice_qa.json" \
            --mixed-qa "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Record status
        if: always()
        env:
          HAS_JOB: ${{ steps.pick.outputs.has_job }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          if [ "$HAS_JOB" = "true" ]; then
            echo "Unique MP4 preview ready for $EPISODE. Confirm publication separately in Publora; public upload is subject to voice QA, opt-in and plan quota." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new approved episodes in the queue; did not produce duplicates." >> "$GITHUB_STEP_SUMMARY"
          fi
