name: Shorts Factory - Three Unique Cloud Previews Daily
on:
  push:
    branches: [main]
    # Release a newly approved/revised private episode immediately when
    # the source catalog is merged via GitHub PR. Bot commits made with
    # GITHUB_TOKEN do not recursively trigger push workflows; the ingest bot
    # explicitly dispatches them. Receipt dedup blocks repeated renders.
    paths:
      - '.github/workflows/daily-preview.yml'
      - 'cloud-shorts/preview_queue.py'
      - 'cloud-shorts/episodes.json'
      - 'cloud-shorts/render_episode.py'
      - 'cloud-shorts/cartesia_voice.py'
      - 'cloud-shorts/selfhosted_voice.py'
      - 'cloud-shorts/voice_routing.py'
  schedule:
    # Review-only cut revision: final helmet-removal scene should begin after the strap adjustment.
    # Revalidate scene-first Deep voice chapter anchors after the ASR-corrected word "Остаётся".
    # Three scene visual review: close helmet, 4.4s adjustment, riding helmet; retry only verified failed clip.
    # Visual-review-only helmet pilot: second scene now shows an actual helmet adjustment.
    # Approved real DEEP voice recordings for helmet and dirt are pinned: run ASR-gated render, never fall back to Silero.
    # Bounded Pexels excerpt repair is active: verify first real bass-voice MP4.
    # Keyless story catalog refreshed; trigger one real publishability test.
    # 16 non-overlapping production attempts per day, 90 minutes apart (UTC).
    # Owner-approved provider voice only: first end-to-end Deep MP4 QA with correct
    # licensed real stock, pinned audio SHA256 and mandated attribution.
    # Third independent V6 garage MP4: preflighted all Russian narration tokens.
    # Corrected low music-gain floor, ASR-verified track narration, and one audited unpublished recovery.
    # Production continuity check: next eligible V6 episode after successful forest release.
    # This is a target, not a promise: every MP4 still needs licensed sources and >=97% speech QA.
    - cron: "45 0,3,6,9,12,15,18,21 * * *"
    - cron: "15 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: moto-shorts-unique-preview-queue
  cancel-in-progress: false

jobs:
  daily-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARTESIA_TTS_ENABLED: ${{ vars.CARTESIA_TTS_ENABLED }}
      CARTESIA_KEY_PRESENT: ${{ secrets.CARTESIA_API_KEY != '' }}
      GUSTAVA_SELFHOSTED_TTS_ENABLED: ${{ vars.GUSTAVA_SELFHOSTED_TTS_ENABLED }}
      GUSTAVA_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_VOICE_API_KEY != '' }}
      GUSTAVA_VOICE_API_URL: ${{ vars.GUSTAVA_VOICE_API_URL }}
      GUSTAVA_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_VOICE_APPROVED_HOST }}
      GUSTAVA_VOICE_REFERENCE_SHA256: ${{ vars.GUSTAVA_VOICE_REFERENCE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check content queue and reserve next episode
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_render_episode.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_voice_style.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_native_bass_voice.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_deep_voice.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_cartesia_voice.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_selfhosted_voice.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_voice_routing.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_visual_director.py' -v
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'cloud-shorts')
          from deep_voice import PROFILE_ID, VOICE_ENGINE, VOICE_ID
          assert PROFILE_ID == 'gustava_create_audio_deep_v1'
          assert VOICE_ENGINE == 'aidocmaker_deep'
          assert VOICE_ID == 'deep'
          print('PRODUCTION_GUSTAVA_REAL_CREATE_AUDIO_DEEP_ONLY', PROFILE_ID)
          from cartesia_voice import VOICE_ENGINE as CARTESIA_ENGINE, MODEL_ID
          assert CARTESIA_ENGINE == 'cartesia_sonic36'
          assert MODEL_ID == 'sonic-3.6-2026-08-27'
          print('CARTESIA_PRIVATE_PREVIEW_REQUIRES_SECURE_CONFIG_AND_BUDGET')
          PY
          python3 -m unittest discover -s cloud-shorts -p 'test_voice_qa.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_deep_male_release.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_qa_autorepair.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_motion_gate.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_visual_revision.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_ten_daily_slots.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_editorial_guard.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_preview_queue.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_engagement_cta.py' -v
          python3 cloud-shorts/editorial_guard.py --catalog cloud-shorts/episodes.json
          python3 cloud-shorts/preview_queue.py choose --output "$GITHUB_OUTPUT"
      - name: Install free audio/video engines
        if: steps.pick.outputs.has_job == 'true'
        run: |
          sudo apt-get install -y -o Dpkg::Use-Pty=0 --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep rubberband
          # Production is pinned to the ORIGINAL pre-rendered AI Doc Maker DEEP
          # voice. Retired Piper, Silero, Kokoro, phonemizer and ruaccent are
          # not invoked; installing them blocked every real Short because
          # kokoro==0.9.4 does not exist in the provider package index.
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          # CPU-only fallback Whisper uses PyTorch; never pull CUDA builds.
          python3 -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install independent Russian ASR (pinned decoder)
        if: steps.pick.outputs.has_job == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check faster-whisper==1.2.1 av==18.1.0 openai-whisper
          python3 - <<'PY'
          import av
          assert av.__version__.startswith('18.1.')
          print('PYAV_PINNED_FOR_FAST_WHISPER', av.__version__)
          PY
      - name: Render and automatically repair bad narration or voice masking (maximum three QA attempts)
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          GUSTAVA_VOICE_API_KEY: ${{ secrets.GUSTAVA_VOICE_API_KEY }}
          CARTESIA_MONTHLY_CHAR_LIMIT: ${{ vars.CARTESIA_MONTHLY_CHAR_LIMIT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 cloud-shorts/qa_autorepair.py --episode "$EPISODE"
          ffprobe -v error -show_entries stream=codec_type,width,height \
            -show_entries format=duration -of json "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4"
      - name: Store MP4, final ASR and repair diagnostic even on technical failure
        if: ${{ always() && steps.pick.outputs.has_job == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-preview-${{ steps.pick.outputs.episode }}-${{ github.run_id }}
          path: cloud-shorts/dist/new/
          retention-days: 30
          if-no-files-found: error
      - name: Mark one-off preview as completed
        if: steps.pick.outputs.has_job == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/preview_queue.py finish --episode "$EPISODE" --qa-report "cloud-shorts/dist/new/$EPISODE/voice_qa.json" --mixed-qa-report "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Record status
        if: always()
        env:
          HAS_JOB: ${{ steps.pick.outputs.has_job }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          if [ "$HAS_JOB" = "true" ]; then
            # Never label a failed ASR run as a successful production.
            python3 - "$EPISODE" <<'PY'
          import json,sys
          from pathlib import Path
          episode=sys.argv[1]
          base=Path("cloud-shorts/dist/new")/episode
          missing=[n for n in ("voice_qa.json","mixed_audio_qa.json","visual_qa.json")
                   if not (base/n).is_file()]
          if missing:
              raise SystemExit("PREVIEW_BUILD_INCOMPLETE: missing QA reports "+
                               ", ".join(missing)+"; video NOT published")
          raw=json.loads((base/"voice_qa.json").read_text(encoding="utf8"))
          mix=json.loads((base/"mixed_audio_qa.json").read_text(encoding="utf8"))
          visual=json.loads((base/"visual_qa.json").read_text(encoding="utf8"))
          sequence=visual.get("source_sequence") or []
          if not (visual.get("version") in (2,3) and visual.get("passed") is True
                  and visual.get("episode")==episode and 2<=len(sequence)<=5
                  and (len(sequence)<=3 or visual["version"]==3)
                  and len(set(sequence))==len(sequence)):
              raise SystemExit("VISUAL_EDITORIAL_QA_RELEASE_BLOCKED")
          if not (raw.get("passed") is True and mix.get("passed") is True
                  and raw.get("lexical_coverage",0)>=.97
                  and mix.get("lexical_coverage",0)>=.97):
              print("VOICE_QA_RELEASE_BLOCKED: MP4 artifact exists for internal inspection; 0 videos published")
              raise SystemExit(1)
          print("PREVIEW_ARTIFACT_QA_PASSED",episode)
          PY
            echo "Unique original MP4 preview with accurate native Russian speech ready for $EPISODE; public publication still requires approved episode + configured publisher." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::QUEUE_EMPTY — 0 videos generated because episode catalog has no new verified story."
            echo "QUEUE_EMPTY: zero new videos generated. Add new unique rights-cleared scripts and footage; do not report as publishing success." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dispatch idempotent Buffer publisher only after genuine passing MP4
        if: ${{ success() && steps.pick.outputs.has_job == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          if repo != "GUSTAVA009/moto-shorts-cloud":
              raise SystemExit("Wrong repository for Buffer dispatch")
          token=os.environ["GH_TOKEN"]
          if not token:
              raise SystemExit("Cannot dispatch publisher without GitHub token")
          req=urllib.request.Request(
              "https://api.github.com/repos/"+repo+
              "/actions/workflows/buffer-backlog.yml/dispatches",
              data=json.dumps({"ref":"main"}).encode("utf8"),
              headers={"Authorization":"Bearer "+token,
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"gustava-verified-mp4-publisher"},
              method="POST")
          with urllib.request.urlopen(req,timeout=35) as response:
              if response.status != 204:
                  raise RuntimeError("GitHub did not accept Buffer dispatch")
          print("BUFFER_VERIFIED_DISPATCH_CONFIRMED",os.environ["EPISODE"],flush=True)
          PY
      - name: Refill the verified preview reserve after each successful MP4
        if: ${{ success() && steps.pick.outputs.has_job == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          if repo != "GUSTAVA009/moto-shorts-cloud" or not token:
              raise SystemExit("Verified production refiller missing authorized scope")
          def get(path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+"/"+path,
                  headers={"Authorization":"Bearer "+token,
                           "Accept":"application/vnd.github+json",
                           "User-Agent":"gustava-verified-preview-refill"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          raw=get("contents/cloud-shorts/episodes.json?ref=main")
          catalog=json.loads(base64.b64decode(raw["content"]))
          tree=get("git/trees/render-ledger?recursive=1")
          if tree.get("truncated"):
              raise RuntimeError("Refill aborted: incomplete permanent receipt ledger")
          reserved={x["path"].split("/")[-1][:-5] for x in tree["tree"]
                    if x["path"].startswith("render-receipts/")
                    and x["path"].endswith(".json")}
          import sys
          sys.path.insert(0,"cloud-shorts")
          from voice_routing import ready
          from editorial_novelty import is_repeated_visual_formula
          from preview_queue import eligible_retry, preview_fingerprint
          # Repaired, still-private episodes have existing render receipts.
          # The old refiller mistook them for exhausted inventory and stopped.
          published={x["path"].split("/")[-1][:-5] for x in tree["tree"]
                     if (x["path"].startswith("publication-receipts/")
                         or x["path"].startswith("buffer-publication-receipts/"))
                     and x["path"].endswith(".json")}
          revised=[]
          for ep in catalog["episodes"]:
              if (ep.get("auto_preview") is not True
                  or ep.get("auto_publish") is not False
                  or ep.get("visual_revision_requested") is not True
                  or ep["id"] not in reserved or ep["id"] in published
                  or ep.get("editorial_rejected") is True
                  or ep.get("visual_review_failed") is True
                  or is_repeated_visual_formula(ep,catalog["episodes"])
                  or not ready(ep)):
                  continue
              record=get("contents/render-receipts/"+ep["id"]+
                         ".json?ref=render-ledger")
              receipt=json.loads(base64.b64decode(record["content"]))
              if eligible_retry(ep,receipt,preview_fingerprint(ep)):
                  revised.append(ep["id"])
          print("PRIVATE_DEEP_CAPTION_REVISIONS_PENDING",revised,flush=True)
          waiting=[
              ep["id"] for ep in catalog["episodes"]
              if ep.get("auto_preview") is True
              and ep.get("auto_publish") is False
              and ep.get("id") not in reserved
              and ep.get("editorial_rejected") is not True
              and ep.get("visual_review_failed") is not True
              and not is_repeated_visual_formula(ep,catalog["episodes"])
              and ready(ep)
          ]
          waiting=revised+waiting
          if not waiting:
              print("VERIFIED_DEEP_RESERVE_DRAINED: no unattended DEEP synthesis "
                    "available; no substitute voice and no fictional MP4",flush=True)
              raise SystemExit(0)
          body=json.dumps({"ref":"main"}).encode()
          req=urllib.request.Request(
              "https://api.github.com/repos/"+repo+
              "/actions/workflows/daily-preview.yml/dispatches",
              data=body, method="POST",
              headers={"Authorization":"Bearer "+token,
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"gustava-verified-preview-refill"})
          with urllib.request.urlopen(req,timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError("GitHub refused next private render dispatch")
          print("VERIFIED_DEEP_REFILL_DISPATCHED",waiting[0],
                "remaining_exact_mp3_ready",len(waiting),flush=True)
          PY
      - name: Replenish next eligible original voice preview from verified unrendered stock
        if: ${{ always() && !cancelled() && steps.pick.outputs.has_job == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, "cloud-shorts")
          from autofill_catalog import github
          from preview_batch_supply import pending_verified_previews
          raw=github("GET", "contents/cloud-shorts/episodes.json?ref=main")
          catalog=json.loads(base64.b64decode(raw["content"]))
          tree=github("GET", "git/trees/render-ledger?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("BATCH_SUPPLY_LEDGER_TRUNCATED: cannot safely dispatch")
          reserved={Path(row["path"]).stem for row in tree["tree"]
                    if row["path"].startswith("render-receipts/")
                    and row["path"].endswith(".json")}
          pending=pending_verified_previews(catalog,reserved)
          print("REAL_DEEP_PENDING_RENDER_INVENTORY",
                json.dumps({"count":len(pending),"ids":pending[:12]}),flush=True)
          if pending:
              github("POST","actions/workflows/daily-preview.yml/dispatches",
                     {"ref":"main"})
              print("NEXT_ORIGINAL_DEEP_RENDER_DISPATCHED",pending[0],flush=True)
          else:
              print("DEEP_RENDER_RESERVE_EXHAUSTED: only unvoiced drafts remain; "
                    "no unauthorized narrator substitution",flush=True)
          PY

