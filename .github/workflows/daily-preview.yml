name: Shorts Factory - Three Unique Cloud Previews Daily
on:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-preview.yml', 'cloud-shorts/preview_queue.py', 'cloud-shorts/test_preview_queue.py', 'cloud-shorts/episodes.json', 'cloud-shorts/voice_qa.py', 'cloud-shorts/asr_fallback.py', 'cloud-shorts/silero_voice.py', 'cloud-shorts/kokoro_voice.py', 'cloud-shorts/mixed_audio_qa.py', 'cloud-shorts/publora_autopublish.py']
  schedule:
    # All times UTC. 04:05 UTC = 07:05 Moscow (UTC+3).
    - cron: "05 04 * * *"
    - cron: "05 10 * * *"
    - cron: "05 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: moto-shorts-unique-preview-queue
  cancel-in-progress: false

jobs:
  daily-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check content queue and reserve next episode
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_render_episode.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_editorial_guard.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_preview_queue.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_engagement_cta.py' -v
          python3 cloud-shorts/editorial_guard.py --catalog cloud-shorts/episodes.json
          python3 cloud-shorts/preview_queue.py choose --output "$GITHUB_OUTPUT"
      - name: Install free audio/video engines
        if: steps.pick.outputs.has_job == 'true'
        run: |
          sudo apt-get install -y -o Dpkg::Use-Pty=0 --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng libespeak-ng1
          # Keep preinstalled CUDA dependencies off a CPU-only cloud runner.
          python3 -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check piper-tts==1.8.0 silero==0.5.5 kokoro==0.9.4 ruaccent==1.5.8.3 phonemizer==3.4.0 misaki==0.9.4 soundfile==0.14.0 huggingface_hub
      - name: Produce next unique Shorts preview in GitHub Cloud
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/render_episode.py --episode "$EPISODE"
          ffprobe -v error -show_entries stream=codec_type,width,height \
            -show_entries format=duration -of json "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4"
      - name: Independent Russian speech QA (missing words and endings)
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 -m pip install --disable-pip-version-check faster-whisper==1.2.1 openai-whisper
          python3 cloud-shorts/voice_qa.py \
            --episode "$EPISODE" \
            --wav "cloud-shorts/work/$EPISODE/new_narration.wav" \
            --out "cloud-shorts/dist/new/$EPISODE/voice_qa.json"
      - name: Verify original Russian words remain clear after MP4 music mixing
        if: steps.pick.outputs.has_job == 'true'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/mixed_audio_qa.py --episode "$EPISODE" \
            --mp4 "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4" \
            --out "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Store MP4, cover, metadata and internal licence records
        if: steps.pick.outputs.has_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-preview-${{ steps.pick.outputs.episode }}-${{ github.run_id }}
          path: cloud-shorts/dist/new/
          retention-days: 30
          if-no-files-found: error
      - name: Mark one-off preview as completed
        if: steps.pick.outputs.has_job == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          python3 cloud-shorts/preview_queue.py finish --episode "$EPISODE" --qa-report "cloud-shorts/dist/new/$EPISODE/voice_qa.json" --mixed-qa-report "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Publish NEW MP4 through Publora only after Russian QA and account opt-in
        if: steps.pick.outputs.has_job == 'true' && vars.BUFFER_AUTO_PUBLISH_ENABLED == 'false'
        env:
          EPISODE: ${{ steps.pick.outputs.episode }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          PUBLORA_AUTO_PUBLISH_ENABLED: ${{ vars.PUBLORA_AUTO_PUBLISH_ENABLED }}
        run: |
          # Automatic publishing requires explicit episode approval and high-quality
          # voice recognition from BOTH original WAV and final MP4.
          if ! python3 - "$EPISODE" <<'PY'
          import json,sys
          from pathlib import Path
          ep_id=sys.argv[1]
          catalog=json.loads(Path("cloud-shorts/episodes.json").read_text(encoding="utf8"))
          ep=next((x for x in catalog["episodes"] if x["id"]==ep_id),None)
          base=Path("cloud-shorts/dist/new")/ep_id
          raw=json.loads((base/"voice_qa.json").read_text(encoding="utf8"))
          mix=json.loads((base/"mixed_audio_qa.json").read_text(encoding="utf8"))
          approved=bool(ep and ep.get("auto_publish") is True)
          accurate=(raw.get("lexical_coverage",0)>=.97 and mix.get("lexical_coverage",0)>=.97
                    and raw.get("final_word_present") is True and mix.get("final_word_present") is True)
          if not approved:
              print("PREVIEW_ONLY_NOT_APPROVED_FOR_PUBLIC_RELEASE")
              raise SystemExit(3)
          if not accurate:
              print("VOICE_QA_97_PERCENT_OR_ENDING_FAILED")
              raise SystemExit(2)
          print("AUTOPUBLISH_QA_APPROVED",ep_id)
          PY
          then
            echo "PUBLIC_RELEASE_BLOCKED: reviewer approval or 97% original+mixed ASR not met; preview artifact preserved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PUBLORA_AUTO_PUBLISH_ENABLED" != "true" ] || [ -z "$PUBLORA_API_KEY" ]; then
            echo "AUTO_PUBLISH_NOT_CONFIGURED: No upload; set verified Publora key and repo variable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -s "cloud-shorts/dist/new/$EPISODE/voice_qa.json" ]; then
            echo "VOICE_QA_MISSING: public upload blocked" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 cloud-shorts/publora_autopublish.py \
            --episode "$EPISODE" \
            --video "cloud-shorts/dist/new/$EPISODE/$EPISODE.mp4" \
            --metadata "cloud-shorts/dist/new/$EPISODE/publication.json" \
            --voice-qa "cloud-shorts/dist/new/$EPISODE/voice_qa.json" \
            --mixed-qa "cloud-shorts/dist/new/$EPISODE/mixed_audio_qa.json"
      - name: Record status
        if: always()
        env:
          HAS_JOB: ${{ steps.pick.outputs.has_job }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          if [ "$HAS_JOB" = "true" ]; then
            # Never label a failed ASR run as a successful production.
            python3 - "$EPISODE" <<'PY'
          import json,sys
          from pathlib import Path
          episode=sys.argv[1]
          base=Path("cloud-shorts/dist/new")/episode
          raw=json.loads((base/"voice_qa.json").read_text(encoding="utf8"))
          mix=json.loads((base/"mixed_audio_qa.json").read_text(encoding="utf8"))
          if not (raw.get("passed") is True and mix.get("passed") is True
                  and raw.get("lexical_coverage",0)>=.97
                  and mix.get("lexical_coverage",0)>=.97):
              print("VOICE_QA_RELEASE_BLOCKED: MP4 artifact exists for internal inspection; 0 videos published")
              raise SystemExit(1)
          print("PREVIEW_ARTIFACT_QA_PASSED",episode)
          PY
            echo "Unique original MP4 preview with accurate native Russian speech ready for $EPISODE; public publication still requires approved episode + configured publisher." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::QUEUE_EMPTY — 0 videos generated because episode catalog has no new verified story."
            echo "QUEUE_EMPTY: zero new videos generated. Add new unique rights-cleared scripts and footage; do not report as publishing success." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
