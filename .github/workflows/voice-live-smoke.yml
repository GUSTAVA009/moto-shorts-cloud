name: GUSTAVA - LIVE Signed OIDC Voice API Canary (NO publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-live-smoke.yml'
      - 'voice-studio/owner_clone_service.py'
      - 'cloud-shorts/voice_failover.py'
      - 'cloud-shorts/pronunciation_ru.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: gustava-real-owner-tts-canary
  cancel-in-progress: false
jobs:
  check-real-private-owner-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GUSTAVA_SELFHOSTED_TTS_ENABLED: '1'
      GUSTAVA_VOICE_OIDC_ENABLED: '1'
      GUSTAVA_VOICE_API_URL: 'https://voice.hapychrust.ru/v1/audio/speech'
      GUSTAVA_VOICE_APPROVED_HOST: 'voice.hapychrust.ru'
      GUSTAVA_VOICE_REFERENCE_SHA256: 'ed27b23b9f86345c45263ab28957e96fd2d399379b3ea90ed9fbc75be183a3cc'
    steps:
      - uses: actions/checkout@v4
      - name: Generate a REAL Russian WAV via the owner's server using signed Actions OIDC
        run: |
          python3 - <<'PY'
          import os,sys,hashlib,wave,io
          sys.path.insert(0,"cloud-shorts")
          import voice_failover as v
          from selfhosted_voice import valid_source_wav
          # Diagnose only non-secret, boolean claim compatibility on the
          # GitHub runner. NEVER print JWT, bearer, payload values or signature.
          import json,base64
          signed=v.owner_actions_oidc(os.environ)
          payload=signed.split(".")[1]
          claim=json.loads(base64.urlsafe_b64decode(
              payload+"="*((-len(payload))%4)))
          expected_workflow=(
              "GUSTAVA009/moto-shorts-cloud/.github/workflows/"
              "voice-live-smoke.yml@refs/heads/main")
          checks={
              "issuer_ok":claim.get("iss")=="https://token.actions.githubusercontent.com",
              "audience_ok":claim.get("aud")=="voice.hapychrust.ru",
              "has_nbf":"nbf" in claim,
              "has_exp":"exp" in claim,
              "has_iat":"iat" in claim,
              "has_sub":"sub" in claim,
              "repo_id_ok":str(claim.get("repository_id"))=="1436068497",
              "repo_ok":claim.get("repository")=="GUSTAVA009/moto-shorts-cloud",
              "branch_ok":claim.get("ref")=="refs/heads/main",
              "workflow_ok":claim.get("workflow_ref")==expected_workflow,
              "has_job_workflow_ref":"job_workflow_ref" in claim,
          }
          print("LIVE_OIDC_CLAIM_BOOLEAN_DIAGNOSTIC",
                json.dumps(checks,sort_keys=True))
          from pronunciation_ru import to_speech_text
          episode={
              "id":"private-oidc-canary-track-20261102",
              "narration":"Мотоциклист едет по треку. На треке важны шлем, плавное торможение и внимательность. Это тест настоящего русского звучания.",
          }
          spoken=to_speech_text(episode["narration"])
          assert "по трэку" in spoken and "На трэке" in spoken
          assert "по треку" in episode["narration"]
          print("PRIVATE_TTS_PHONEME_PREPARED", "canonical=трек", "spoken=трэк")
          audio,ref_sha,route=v.synthesize(episode,env=os.environ,
              validator=valid_source_wav)
          with wave.open(io.BytesIO(audio),"rb") as w:
              seconds=w.getnframes()/w.getframerate()
          assert route=="cloud", route
          assert ref_sha==os.environ["GUSTAVA_VOICE_REFERENCE_SHA256"]
          assert seconds>=3.0 and len(audio)>10000
          print("LIVE_CLOUD_QWEN_REAL_WAV_VERIFIED",
                "route",route,"duration_sec",round(seconds,2),
                "sha256",hashlib.sha256(audio).hexdigest())
          from pathlib import Path
          Path("private-ru-track-canary.wav").write_bytes(audio)
          print("PRIVATE_RU_TRACK_CANARY_WAV_CREATED", "bytes",len(audio))
          print("NO_PUBLICATION_PERFORMED; this is NOT narrator editorial approval")
          PY
      - name: Archive only this private pronunciation WAV for actual owner listening
        uses: actions/upload-artifact@v4
        with:
          name: private-ru-track-canary-${{ github.run_id }}
          path: private-ru-track-canary.wav
          retention-days: 1
          if-no-files-found: error
