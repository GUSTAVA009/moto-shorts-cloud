# Independent visual review of ORIGINAL real MP4s. No manual per-video toggles.
# Never approves source-only drafts, expired artifacts or mismatched footage.
name: GUSTAVA - Autonomous Frame Reviewed Shorts to Direct YouTube
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Shorts Factory - Three Unique Cloud Previews Daily']
    types: [completed]
  schedule:
    - cron: '12 */3 * * *' # Fallback only; successful renders dispatch review immediately
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-editorial-review.yml'
      - 'cloud-shorts/autonomous_visual_review.py'
      - 'cloud-shorts/test_autonomous_visual_review.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: gustava-autonomous-independent-frame-review
  cancel-in-progress: false

jobs:
  independent-frame-review:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify strict automatic review and immutable receipt contracts
        run: |
          python3 -m compileall -q cloud-shorts
          python3 -m unittest discover -s cloud-shorts -p 'test_autonomous_visual_review.py' -v
      - name: Select one REAL original privately rendered Cartoon B MP4
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 cloud-shorts/autonomous_visual_review.py select --output "$GITHUB_OUTPUT"
      - name: Reuse pinned independent vision model across hosted runs
        if: steps.pick.outputs.has_job == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: gustava-ollama-qwen3.5-4b-v1
      - name: Install independent keyless image-capable reviewer on isolated runner
        if: steps.pick.outputs.has_job == 'true'
        timeout-minutes: 10
        env:
          OLLAMA_HOST: 127.0.0.1:11434
        run: |
          set -euo pipefail
          # Never open the service to the Internet or another host.
          # Official Ollama runtime + Apache-2.0 Qwen3.5 4B Vision/Language.
          curl --retry 2 -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          nohup ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3.5:4b
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              'http://127.0.0.1:11434/api/show',
              data=json.dumps({'model':'qwen3.5:4b'}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
              model=json.load(response)
          if 'vision' not in model.get('capabilities', []):
              raise SystemExit('AUTO_FRAME_REVIEW_MODEL_NOT_VISION_CAPABLE')
          print('KEYLESS_LOCAL_MULTIMODAL_REVIEWER_READY qwen3.5:4b', flush=True)
          PY
      - name: Download exact QA-verified original MP4 and QA evidence
        if: steps.pick.outputs.has_job == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.pick.outputs.artifact_name }}
          run-id: ${{ steps.pick.outputs.render_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: staged
      - name: Review ACTUAL movie frames and publish only independently approved originals
        if: steps.pick.outputs.has_job == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The local multimodal API is on this very runner, not the user's
          # desktop and not a remote endpoint that needs a paid vision key.
          GUSTAVA_LOCAL_VISION_ENABLED: '1'
          EPISODE: ${{ steps.pick.outputs.episode }}
          RENDER_ID: ${{ steps.pick.outputs.render_id }}
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          timeout --signal=TERM --kill-after=15s 420s python3 cloud-shorts/autonomous_visual_review.py review \
            --episode "$EPISODE" --run-id "$RENDER_ID" --directory staged
      - name: Record unattended review stage truthfully
        if: always()
        env:
          HAS_JOB: ${{ steps.pick.outputs.has_job }}
        run: |
          if [ "$HAS_JOB" = 'true' ]; then
            echo 'Actual MP4 inspected or review blocked; automatic public release requires passed frame, voice, visual and exact SHA checks.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No eligible new unreviewed original MP4. No direct YouTube post was created.' >> "$GITHUB_STEP_SUMMARY"
          fi
