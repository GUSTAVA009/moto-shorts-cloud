name: GUSTAVA - verify existing YouTube OAuth (no uploads)
on:
  push:
    branches:
      - feature/agenttube-youtube-bridge
    paths:
      - .github/workflows/gustava-youtube-oauth-audit.yml
      - storyverse/agenttube-bridge/audit_request.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-existing-google-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
    steps:
      - name: Verify credential presence without exposing values
        shell: bash
        run: |
          python - <<'PY'
          import os
          needed = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [name for name in needed if not os.environ.get(name)]
          if missing:
              print("OAUTH_AUDIT: credentials unavailable: " + ", ".join(missing))
              raise SystemExit(2)
          print("OAUTH_AUDIT: existing credentials present; values hidden")
          PY
      - name: Install read-only Google API dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth google-api-python-client
      - name: Verify channel identity without uploading
        shell: bash
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
          )
          credentials.refresh(Request())
          youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)
          result = youtube.channels().list(part="snippet", mine=True, maxResults=5).execute()
          channels = result.get("items", [])
          if not channels:
              print("OAUTH_AUDIT: token refreshed, no authorized YouTube channel")
              raise SystemExit(3)
          expected = os.getenv("YOUTUBE_EXPECTED_CHANNEL_ID", "").strip()
          for ch in channels:
              print("OAUTH_AUDIT: channel_id=%s channel_title=%s" % (ch.get("id"), ch.get("snippet",{}).get("title")))
          if expected and all(ch.get("id") != expected for ch in channels):
              print("OAUTH_AUDIT: expected channel mismatch, uploads blocked")
              raise SystemExit(4)
          print("OAUTH_AUDIT: channel read access verified, no upload attempted")
          PY
