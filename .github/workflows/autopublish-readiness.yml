name: GUSTAVA - Buffer Autopublish Readiness (No Publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autopublish-readiness.yml'
      - 'cloud-shorts/publication_safety.py'
      - 'cloud-shorts/buffer_autopublish.py'
      - 'cloud-shorts/test_publication_safety.py'
      - 'cloud-shorts/test_buffer_autopublish.py'
      - 'cloud-shorts/test_publish_workflows.py'
permissions:
  contents: read
jobs:
  buffer-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_AUTO_PUBLISH_ENABLED: ${{ vars.BUFFER_AUTO_PUBLISH_ENABLED }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline editorial, mixed audio and duplicate-protection gates
        run: |
          python3 -m compileall -q cloud-shorts
          python3 -m unittest discover -s cloud-shorts -p 'test_publication_safety.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_buffer_autopublish.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_find_pending_buffer.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_publish_workflows.py' -v
      - name: Report Buffer-only readiness without uploading anything
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = bool(os.environ.get('BUFFER_API_KEY'))
          enabled = os.environ.get('BUFFER_AUTO_PUBLISH_ENABLED') == 'true'
          channel = os.environ.get('YOUTUBE_EXPECTED_CHANNEL_ID') == 'UCS0QCodPcFBTjMt4ioEWOUw'
          lines = ['## GUSTAVA Enduro - Buffer-only transport', '',
                   '- Buffer API key configured: '+('YES' if key else 'NO'),
                   '- Automatic publishing opt-in: '+('YES' if enabled else 'NO'),
                   '- Expected YouTube channel ID matches: '+('YES' if channel else 'NO'),
                   '- Legacy publisher workflow: REMOVED',
                   '- MP4 storage: GitHub Releases, no R2 credentials required',
                   '- This check never publishes or schedules a video']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('BUFFER_READINESS', 'ENABLED' if key and enabled and channel else 'INCOMPLETE')
          PY
