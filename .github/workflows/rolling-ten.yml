name: GUSTAVA - Rolling 10 Confirmed Shorts and Next 10 Script Reserve
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['GUSTAVA - Verified Shorts to Buffer Queue']
    types: [completed]
  schedule:
    # Match 90-minute production cadence; 15-minute polling would exceed
    # a 1,000-requests-per-30-days API quota on some Buffer plans.
    - cron: "25 0,3,6,9,12,15,18,21 * * *"
    - cron: "55 1,4,7,10,13,16,19,22 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/rolling-ten.yml'
      - 'cloud-shorts/rolling_batches.py'
      - 'cloud-shorts/rolling_batch_worker.py'
      - 'cloud-shorts/test_rolling_batches.py'
      - 'cloud-shorts/test_rolling_batch_worker.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: gustava-rolling-ten-buffer-sent-audit
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID || 'UCS0QCodPcFBTjMt4ioEWOUw' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify ninth/tenth milestones without sending any posts
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_rolling_batches.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_rolling_batch_worker.py' -v
      - name: Check real Buffer sent statuses and prepare or promote ten scripts
        env:
          GUSTAVA_VOICE_REFERENCE_SHA256: ${{ vars.GUSTAVA_VOICE_REFERENCE_SHA256 }}
          GUSTAVA_SELFHOSTED_TTS_ENABLED: ${{ vars.GUSTAVA_SELFHOSTED_TTS_ENABLED }}
          GUSTAVA_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_VOICE_API_KEY != '' }}
          GUSTAVA_VOICE_API_URL: ${{ vars.GUSTAVA_VOICE_API_URL }}
          GUSTAVA_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_VOICE_APPROVED_HOST }}
          GUSTAVA_LOCAL_TTS_ENABLED: ${{ vars.GUSTAVA_LOCAL_TTS_ENABLED }}
          GUSTAVA_LOCAL_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_LOCAL_VOICE_API_KEY != '' }}
          GUSTAVA_LOCAL_VOICE_API_URL: ${{ vars.GUSTAVA_LOCAL_VOICE_API_URL }}
          GUSTAVA_LOCAL_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_LOCAL_VOICE_APPROVED_HOST }}
          GUSTAVA_TERTIARY_TTS_ENABLED: ${{ vars.GUSTAVA_TERTIARY_TTS_ENABLED }}
          GUSTAVA_TERTIARY_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_TERTIARY_VOICE_API_KEY != '' }}
          GUSTAVA_TERTIARY_VOICE_API_URL: ${{ vars.GUSTAVA_TERTIARY_VOICE_API_URL }}
          GUSTAVA_TERTIARY_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_TERTIARY_VOICE_APPROVED_HOST }}
          GUSTAVA_TERTIARY_VOICE_CANARY_APPROVED: ${{ vars.GUSTAVA_TERTIARY_VOICE_CANARY_APPROVED }}
        run: python3 cloud-shorts/rolling_batch_worker.py
