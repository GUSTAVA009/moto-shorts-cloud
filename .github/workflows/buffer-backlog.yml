name: GUSTAVA - Verified Shorts to Buffer Queue
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Shorts Factory - Three Unique Cloud Previews Daily']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-backlog.yml'
      - 'cloud-shorts/buffer_autopublish.py'
      - 'cloud-shorts/publication_safety.py'
      - 'cloud-shorts/find_pending_buffer.py'
      - 'cloud-shorts/find_pending_publication.py'
      - 'cloud-shorts/channel_focus.py'
      - 'cloud-shorts/test_buffer_autopublish.py'
      - 'cloud-shorts/test_publish_workflows.py'
  schedule:
    - cron: "17 2,8,14,20 * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: gustava-buffer-verified-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Audit code syntax and publishing safeguards
        run: |
          python3 -m compileall -q cloud-shorts
          python3 -m unittest discover -s cloud-shorts -p 'test_buffer_autopublish.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_find_pending_buffer.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_find_pending_publication.py' -v
      - name: Select one original, QA-passed, never-published video
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 cloud-shorts/find_pending_buffer.py --output "$GITHUB_OUTPUT"
      - name: Download the exact QA-verified MP4
        if: steps.pick.outputs.has_job == 'true' && vars.BUFFER_AUTO_PUBLISH_ENABLED != 'false'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.pick.outputs.artifact_name }}
          run-id: ${{ steps.pick.outputs.render_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: staged
      - name: Publish only through Buffer (no blind retry)
        if: steps.pick.outputs.has_job == 'true' && vars.BUFFER_AUTO_PUBLISH_ENABLED != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_AUTO_PUBLISH_ENABLED: ${{ vars.BUFFER_AUTO_PUBLISH_ENABLED || 'true' }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID || 'UCS0QCodPcFBTjMt4ioEWOUw' }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          test -s "staged/$EPISODE/$EPISODE.mp4"
          test -s "staged/$EPISODE/voice_qa.json"
          test -s "staged/$EPISODE/mixed_audio_qa.json"
          test -s "staged/$EPISODE/publication.json"
          python3 cloud-shorts/buffer_autopublish.py --episode "$EPISODE" \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --metadata "staged/$EPISODE/publication.json" \
            --voice-qa "staged/$EPISODE/voice_qa.json" \
            --mixed-qa "staged/$EPISODE/mixed_audio_qa.json"
      - name: Report no eligible original MP4
        if: steps.pick.outputs.has_job != 'true'
        run: |
          echo 'BUFFER_WAITING_FOR_VERIFIED_ORIGINAL: no unpublished approved video was selected.' >> "$GITHUB_STEP_SUMMARY"
