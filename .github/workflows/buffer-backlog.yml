# Owner-requested immediate Buffer release attempt for any NEW QA-passed, uniquely reviewed MP4 (2026-11-02).
name: GUSTAVA - Verified Shorts to Buffer Queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-backlog.yml'
      # Editor-approved release is the moment a private, QA-passed preview
      # becomes eligible to enter the real Buffer schedule.
      - 'cloud-shorts/episodes.json'
      - 'cloud-shorts/buffer_autopublish.py'
      - 'cloud-shorts/buffer_delivery_gate.py'
      - 'cloud-shorts/test_buffer_delivery_gate.py'
      - 'cloud-shorts/publication_safety.py'
      - 'cloud-shorts/visual_director.py'
      - 'cloud-shorts/find_pending_buffer.py'
      - 'cloud-shorts/find_pending_publication.py'
      - 'cloud-shorts/channel_focus.py'
      - 'cloud-shorts/test_buffer_autopublish.py'
      - 'cloud-shorts/test_publish_workflows.py'
  schedule:
    # Independently check for verified unpublished MP4 every 90 minutes;
    # independent successful frame reviewer explicitly dispatches delivery.
    - cron: "05 1,4,7,10,13,16,19,22 * * *"
    - cron: "35 2,5,8,11,14,17,20,23 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  # GitHub Actions replaces pending runs in a constant group even when
  # cancel-in-progress is false. Use commit-bound groups; per-video
  # immutable Buffer receipts enforce duplicate-free delivery across groups.
  group: gustava-buffer-verified-publishing-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    # Prevent Buffer and the direct YouTube pipeline from posting the same episode.
    if: github.repository == 'GUSTAVA009/moto-shorts-cloud' && vars.YOUTUBE_DIRECT_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit code syntax and publishing safeguards
        run: |
          python3 -m compileall -q cloud-shorts
          python3 -m unittest discover -s cloud-shorts -p 'test_buffer_autopublish.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_buffer_delivery_gate.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_find_pending_buffer.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_find_pending_publication.py' -v
      - name: Select one original, QA-passed, never-published video
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUSTAVA_ORIGINAL_VOICE_APPROVED: ${{ vars.GUSTAVA_ORIGINAL_VOICE_APPROVED }}
          GUSTAVA_VOICE_REFERENCE_SHA256: ${{ vars.GUSTAVA_VOICE_REFERENCE_SHA256 }}
        run: python3 cloud-shorts/find_pending_buffer.py --output "$GITHUB_OUTPUT"
      - name: Download the exact QA-verified MP4
        if: steps.pick.outputs.has_job == 'true' && vars.BUFFER_AUTO_PUBLISH_ENABLED != 'false'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.pick.outputs.artifact_name }}
          run-id: ${{ steps.pick.outputs.render_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: staged
      - name: Publish to the verified pinned GUSTAVA Enduro channel through Buffer
        id: send
        if: steps.pick.outputs.has_job == 'true' && vars.BUFFER_AUTO_PUBLISH_ENABLED != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_AUTO_PUBLISH_ENABLED: ${{ vars.BUFFER_AUTO_PUBLISH_ENABLED || 'true' }}
          GUSTAVA_ORIGINAL_VOICE_APPROVED: ${{ vars.GUSTAVA_ORIGINAL_VOICE_APPROVED }}
          GUSTAVA_VOICE_REFERENCE_SHA256: ${{ vars.GUSTAVA_VOICE_REFERENCE_SHA256 }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID || 'UCS0QCodPcFBTjMt4ioEWOUw' }}
          EPISODE: ${{ steps.pick.outputs.episode }}
        run: |
          set -euo pipefail
          # A hosted GitHub runner already includes ffmpeg/ffprobe. Repeated
          # apt update stalled publication before any MP4 could reach Buffer.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 90s sudo apt-get update -qq
            timeout 90s sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
          test -s "staged/$EPISODE/$EPISODE.mp4"
          test -s "staged/$EPISODE/voice_qa.json"
          test -s "staged/$EPISODE/mixed_audio_qa.json"
          test -s "staged/$EPISODE/visual_qa.json"
          test -s "staged/$EPISODE/publication.json"
          python3 cloud-shorts/buffer_autopublish.py --episode "$EPISODE" \
            --video "staged/$EPISODE/$EPISODE.mp4" \
            --metadata "staged/$EPISODE/publication.json" \
            --voice-qa "staged/$EPISODE/voice_qa.json" \
            --mixed-qa "staged/$EPISODE/mixed_audio_qa.json" | tee "$RUNNER_TEMP/verified_buffer_response.log"
          # A successful process exit can still mean skipped; require a real
          # Buffer ID from the createPost acceptance response.
          python3 cloud-shorts/buffer_delivery_gate.py confirm \
            --log "$RUNNER_TEMP/verified_buffer_response.log" \
            --output "$GITHUB_OUTPUT"
      - name: Immediately send next DISTINCT pre-approved video
        if: steps.send.outputs.queued == 'true' && vars.BUFFER_AUTO_PUBLISH_ENABLED != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 cloud-shorts/buffer_delivery_gate.py dispatch
      - name: Report no eligible MP4 without spending Buffer API quota
        if: steps.pick.outputs.has_job != 'true'
        run: |
          # Buffer API has returned HTTP 429. A zero-candidate check MUST
          # NEVER query the provider just to rediscover an empty stock.
          # Only the daily inventory auditor owns truthful live queue counts.
          echo '## Factory delivery: no eligible reviewed MP4' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Buffer createPost attempt made. Live queue size is unknown here.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The daily read-only inventory audit reports real scheduled counts.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::NO_ELIGIBLE_REVIEWED_MP4: no Buffer API request was made.'
