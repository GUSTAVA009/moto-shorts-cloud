# Conservative recovery: unlike the retired resume script, NEVER cancel
# merely because main moved to a newer SHA. Check actual stuck job STEP.
name: GUSTAVA - Repair Truly Stuck Preview Installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stuck-installer-watchdog.yml'
  schedule:
    - cron: '05,35 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: gustava-verified-stuck-installer-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'GUSTAVA009/moto-shorts-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only an old runner still installing dependencies, never a healthy render
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, time, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "GUSTAVA009/moto-shorts-cloud":
              raise SystemExit("WRONG_REPOSITORY")
          now = dt.datetime.now(dt.timezone.utc)
          root = "https://api.github.com/repos/" + repo + "/"
          token = os.environ["GH_TOKEN"]
          def api(path, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(root+path,method=method,data=data,
                  headers={"Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"gustava-exact-stuck-install-recovery"})
              with urllib.request.urlopen(request, timeout=35) as response:
                  return json.load(response) if response.status not in (202,204) else {}
          def installed_too_long(run_id):
              jobs = api("actions/runs/"+str(run_id)+"/jobs?per_page=100")
              if jobs.get("total_count",0)>100:
                  raise RuntimeError("INCOMPLETE_JOB_LIST_NO_CANCEL")
              for job in jobs.get("jobs",[]):
                  if job.get("name") != "daily-draft" or job.get("status") != "in_progress":
                      continue
                  for step in job.get("steps",[]):
                      if (step.get("name") != "Install free audio/video engines"
                              or step.get("status") != "in_progress"):
                          continue
                      start = step.get("started_at")
                      if not start:
                          return False
                      started = dt.datetime.fromisoformat(start.replace("Z","+00:00"))
                      if (now-started).total_seconds() >= 10*60:
                          return True
              return False
          runs = api("actions/workflows/daily-preview.yml/runs?per_page=60").get("workflow_runs",[])
          for run in runs:
              if run.get("status") != "in_progress":
                  continue
              run_id=run["id"]
              if not installed_too_long(run_id):
                  continue
              artifacts = api("actions/runs/"+str(run_id)+"/artifacts?per_page=100")
              if artifacts.get("total_count",0) != 0:
                  print("STUCK_INSTALL_HAS_ARTIFACT_KEEP", run_id, flush=True)
                  continue
              print("VERIFIED_INSTALL_STUCK_CANCEL_ONLY",run_id,flush=True)
              try:
                  api("actions/runs/"+str(run_id)+"/cancel","POST")
              except urllib.error.HTTPError as exc:
                  if exc.code not in (404,409,422):
                      raise
              time.sleep(5)
              if installed_too_long(run_id):
                  try:
                      api("actions/runs/"+str(run_id)+"/force-cancel","POST")
                      print("VERIFIED_INSTALL_STUCK_FORCE_CANCEL_ONLY",run_id,flush=True)
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (403,404,409,422):
                          raise
              break
          else:
              print("SAFE_WATCHDOG_NO_STUCK_INSTALLER",flush=True)
          PY
