# Safe manual-only recovery. NEVER cancel a healthy render just because
# scripts or the episodes catalog advanced to another commit SHA.
# Existing renderer has a job timeout and a serialized concurrency group.
name: GUSTAVA - Safely Resume Original Shorts Renderer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  resume:
    if: github.repository == 'GUSTAVA009/moto-shorts-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch ONLY if no original preview is already running or queued
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          root = "https://api.github.com/repos/" + repo + "/"
          def call(path, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(root + path, data=data, method=method,
                  headers={"Authorization":"Bearer " + token,
                           "Accept":"application/vnd.github+json",
                           "Content-Type":"application/json",
                           "X-GitHub-Api-Version":"2022-11-28",
                           "User-Agent":"gustava-nondestructive-render-resume"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp) if resp.status != 204 else {}
          workflow = "actions/workflows/daily-preview.yml"
          runs = call(workflow + "/runs?per_page=100").get("workflow_runs", [])
          active = [run for run in runs
                    if run.get("status") in ("in_progress","queued","pending")]
          if active:
              print("RENDER_ALREADY_RUNNING_KEEP_UNINTERRUPTED",
                    [(x["id"], x["status"]) for x in active[:5]], flush=True)
          else:
              call(workflow + "/dispatches", "POST", {"ref":"main"})
              print("SAFE_RENDER_DISPATCHED_WITHOUT_CANCEL", flush=True)
          PY
