name: GUSTAVA - Repair Failed Unpublished Narration Automatically
on:
  workflow_run:
    workflows: ['Shorts Factory - Three Unique Cloud Previews Daily']
    types: [completed]
  workflow_dispatch:
  # Catch historical failed private original MP4s without a manual replay.
  schedule:
    - cron: '23,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'cloud-shorts/repair_failed_preview.py'
      - 'cloud-shorts/select_failed_original_repair.py'
      - 'cloud-shorts/test_repair_failed_preview.py'
      - 'cloud-shorts/test_select_failed_original_repair.py'
      - '.github/workflows/repair-failed-preview.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gustava-bounded-unpublished-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'failure' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed narration repair and deduplication
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_repair_failed_preview.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_source_repair.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_select_failed_original_repair.py' -v
      - name: Verify failed private original receipt and pick exact historical run
        id: pick
        run: |
          python3 cloud-shorts/select_failed_original_repair.py \
            --output "$GITHUB_OUTPUT" \
            --requested-run-id "${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}"
      - name: Retrieve only verified failed original MP4 speech reports
        if: steps.pick.outputs.has_job == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: daily-preview-*
          run-id: ${{ steps.pick.outputs.failed_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: staged
          merge-multiple: true
      - name: Rephrase diagnosed private Russian phonetic errors and request exact rerender
        if: steps.pick.outputs.has_job == 'true'
        env:
          FAILED_PREVIEW_RUN_ID: ${{ steps.pick.outputs.failed_run_id }}
        run: python3 cloud-shorts/repair_failed_preview.py staged
