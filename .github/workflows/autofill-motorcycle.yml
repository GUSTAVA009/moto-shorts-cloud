name: GUSTAVA - Keep Fresh Motorcycle Shorts Queued
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-shorts/autofill_catalog.py'
      - 'cloud-shorts/seed_backlog.json'
      - 'cloud-shorts/test_autofill_catalog.py'
      - '.github/workflows/autofill-motorcycle.yml'
  schedule:
    # UTC: replenish 10 minutes before each of the 10 daily preview slots.
    - cron: "00 04 * * *"
    - cron: "40 05 * * *"
    - cron: "20 07 * * *"
    - cron: "00 09 * * *"
    - cron: "40 10 * * *"
    - cron: "20 12 * * *"
    - cron: "00 14 * * *"
    - cron: "40 15 * * *"
    - cron: "20 17 * * *"
    - cron: "00 19 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: gustava-motorcycle-autofill
  cancel-in-progress: false

jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate curated evergreen motorcycle scripts and licenses
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_autofill_catalog.py' -v
      - name: Add one unseen researched story when queue becomes low
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 cloud-shorts/autofill_catalog.py
