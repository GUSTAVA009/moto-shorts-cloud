name: GUSTAVA - Keep Fresh Motorcycle Shorts Queued
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-shorts/autofill_catalog.py'
      - 'cloud-shorts/rolling_batches.py'
      - 'cloud-shorts/rolling_batch_worker.py'
      - 'cloud-shorts/test_rolling_batches.py'
      - 'cloud-shorts/moto_autocreate.py'
      - 'cloud-shorts/cc0_source_pool.py'
      - 'cloud-shorts/test_cc0_source_pool.py'
      - 'cloud-shorts/moto_assets.py'
      - 'cloud-shorts/verified_pexels_pool.json'
      - 'cloud-shorts/test_curated_source_recovery.py'
      - 'cloud-shorts/test_moto_autocreate.py'
      - 'cloud-shorts/test_moto_assets.py'
      - 'cloud-shorts/seed_backlog.json'
      - 'cloud-shorts/test_autofill_catalog.py'
      - '.github/workflows/autofill-motorcycle.yml'
  schedule:
    # Replenish 10 minutes before each production attempt, 90 minutes apart.
    - cron: "35 0,3,6,9,12,15,18,21 * * *"
    - cron: "05 2,5,8,11,14,17,20,23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: gustava-motorcycle-autofill
  cancel-in-progress: false

jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate curated evergreen motorcycle scripts and licenses
        run: |
          python3 -m unittest discover -s cloud-shorts -p 'test_autofill_catalog.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_moto_assets.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_moto_autocreate.py' -v
          python3 -m unittest discover -s cloud-shorts -p 'test_cc0_source_pool.py' -v
      - name: Create owner-voice-ready scripts without manual Deep narrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GUSTAVA_SCRIPT_MODEL: ${{ vars.GUSTAVA_SCRIPT_MODEL }}
          # New episodes must be synthesizable without calling ChatGPT.
          # Historic Deep-only recordings retain their immutable profile.
          GUSTAVA_TTS_PROVIDER: gustava_selfhosted_qwen3
          GUSTAVA_VOICE_REFERENCE_SHA256: ${{ vars.GUSTAVA_VOICE_REFERENCE_SHA256 }}
          GUSTAVA_SELFHOSTED_TTS_ENABLED: ${{ vars.GUSTAVA_SELFHOSTED_TTS_ENABLED }}
          GUSTAVA_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_VOICE_API_KEY != '' }}
          GUSTAVA_VOICE_API_URL: ${{ vars.GUSTAVA_VOICE_API_URL }}
          GUSTAVA_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_VOICE_APPROVED_HOST }}
          GUSTAVA_LOCAL_TTS_ENABLED: ${{ vars.GUSTAVA_LOCAL_TTS_ENABLED }}
          GUSTAVA_LOCAL_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_LOCAL_VOICE_API_KEY != '' }}
          GUSTAVA_LOCAL_VOICE_API_URL: ${{ vars.GUSTAVA_LOCAL_VOICE_API_URL }}
          GUSTAVA_LOCAL_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_LOCAL_VOICE_APPROVED_HOST }}
          GUSTAVA_TERTIARY_TTS_ENABLED: ${{ vars.GUSTAVA_TERTIARY_TTS_ENABLED }}
          GUSTAVA_TERTIARY_VOICE_KEY_PRESENT: ${{ secrets.GUSTAVA_TERTIARY_VOICE_API_KEY != '' }}
          GUSTAVA_TERTIARY_VOICE_API_URL: ${{ vars.GUSTAVA_TERTIARY_VOICE_API_URL }}
          GUSTAVA_TERTIARY_VOICE_APPROVED_HOST: ${{ vars.GUSTAVA_TERTIARY_VOICE_APPROVED_HOST }}
          GUSTAVA_TERTIARY_VOICE_CANARY_APPROVED: ${{ vars.GUSTAVA_TERTIARY_VOICE_CANARY_APPROVED }}
        run: python3 cloud-shorts/autofill_catalog.py
