name: Shorts Factory - Fast Code and Episode Checks
on:
  push:
    branches: [main]
    paths:
      - "cloud-shorts/episodes.json"
      - "cloud-shorts/render_episode.py"
      - "cloud-shorts/tts_voice.py"
      - "cloud-shorts/silero_voice.py"
      - "cloud-shorts/mixed_audio_qa.py"
      - "cloud-shorts/voice_qa.py"
      - "cloud-shorts/publication_safety.py"
      - "cloud-shorts/qa_autorepair.py"
      - "cloud-shorts/repair_failed_preview.py"
      - "cloud-shorts/source_repair.py"
      - "cloud-shorts/moto_autocreate.py"
      - "cloud-shorts/moto_assets.py"
      - "cloud-shorts/autofill_catalog.py"
      - "cloud-shorts/channel_focus.py"
      - "cloud-shorts/editorial_guard.py"
      - "cloud-shorts/buffer_autopublish.py"
      - "cloud-shorts/find_pending_buffer.py"
      - "cloud-shorts/find_pending_publication.py"
      - "cloud-shorts/source_watch.py"
      - "cloud-shorts/rapid_growth_backlog.json"
      - "series/**/*.json"
      - "cloud-shorts/soundtrack.py"
      - "cloud-shorts/engagement_cta.py"
      - "cloud-shorts/growth_report.py"
      - "cloud-shorts/sprint90.py"
      - "cloud-shorts/growth_baseline.json"
      - "cloud-shorts/test_*.py"
      - ".github/workflows/validate-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax and all safety tests (no external downloads)
        run: |
          python3 -m compileall -q cloud-shorts
          python3 -m unittest discover -s cloud-shorts -p 'test_*.py' -v
      - name: Validate public episode descriptions and internal attribution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "cloud-shorts")
          from render_episode import validate_episode
          from engagement_cta import validate_cta_mix
          catalog = json.loads(Path("cloud-shorts/episodes.json").read_text(encoding="utf8"))
          ids = set()
          used_sources = set()
          for ep in catalog["episodes"]:
              slug = validate_episode(ep)
              assert slug not in ids, "Duplicated story"
              ids.add(slug)
              for source in ep["footage"]:
                  assert source["source_page"] not in used_sources, "Reused source video across different stories"
                  used_sources.add(source["source_page"])
          print("VALIDATED", len(ids), "original episodes and", len(used_sources), "distinct licensed footage sources")
          print("NATURAL_CTA_ROTATION", validate_cta_mix(catalog["episodes"]))
          PY
      - name: Show honest subscriber and $5000 gross target dashboard
        run: python3 cloud-shorts/growth_report.py --output cloud-shorts/dist/growth-report.md
      - name: Create realistic 90-day YouTube Partner Program pace report
        run: python3 cloud-shorts/sprint90.py --output cloud-shorts/dist/sprint90.md
      - name: Archive channel scoreboard and urgent 90-day sprint
        uses: actions/upload-artifact@v4
        with:
          name: growth-sprint90-${{ github.run_id }}
          path: |
            cloud-shorts/dist/growth-report.md
            cloud-shorts/dist/sprint90.md
          retention-days: 30
          if-no-files-found: error
