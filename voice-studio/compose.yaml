# Oracle Cloud ARM64 CPU instance; no NVIDIA GPU and NO LOCAL PC.
# Install the open Qwen3-TTS C CPU engine as a host systemd service
# on http://127.0.0.1:8002 before starting this private web API.
# docker compose -f compose.yaml up -d --build
services:
  voice-api:
    build: .
    restart: unless-stopped
    network_mode: host
    command: ["uvicorn", "app:app", "--host", "127.0.0.1", "--port", "8080",
              "--workers", "1", "--no-server-header", "--no-access-log"]
    environment:
      VOICE_STUDIO_ADMIN_TOKEN: ${VOICE_STUDIO_ADMIN_TOKEN:?Set 40-character owner admin secret}
      VOICE_STUDIO_SESSION_SECRET: ${VOICE_STUDIO_SESSION_SECRET:?Set independent 40-character session secret}
      VOICE_STUDIO_LOCAL_HTTP: "0"
      QWEN_BACKEND_URL: http://127.0.0.1:8002
      VOICE_STUDIO_DATA: /data
    volumes:
      - voice_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 700m
volumes:
  voice_data:
